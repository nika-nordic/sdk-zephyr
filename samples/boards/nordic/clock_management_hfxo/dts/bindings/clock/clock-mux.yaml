description: |
  A clock multiplexer that selects its output from one of several input
  sources. A clock-state configures it via a specifier cell that selects the
  zero-based index into input-sources. The clock-management layer arbitrates
  between competing selections by rank.

compatible: "clock-mux"

include: [base.yaml, clock-controller.yaml]

properties:
  "#clock-cells":
    const: 1

  mgmt-id:
    type: int
    required: true
    description: Stable node id used by the clock-management layer (see clock_ids.h).

  input-sources:
    type: phandles
    required: true
    description: Candidate input clocks, in mux-index order.

  clock-frequency:
    type: int
    description: Nominal output frequency (Hz).

clock-cells:
  - source
