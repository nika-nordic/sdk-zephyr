description: |
  Software-only virtual node representing a clock signal (output) produced by a
  clock node. Clock consumers reference such outputs, and clock-state nodes that
  configure the output are defined as its children (analogous to pinctrl states).

compatible: "clock-output"

properties:
  "#clock-cells":
    type: int
    required: true
