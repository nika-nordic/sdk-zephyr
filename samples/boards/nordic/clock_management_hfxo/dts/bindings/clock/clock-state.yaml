description: |
  A statically defined clock configuration a consumer can select, similar to a
  pinctrl state. It encodes a selection in the clock tree (which node, and which
  of its inputs/gate setting) and a rank used to arbitrate between candidate
  configurations at runtime (lower is preferred). Applying it makes the
  clock-management layer resolve the whole path from the selected node up to its
  source.

compatible: "clock-state"

properties:
  clocks:
    type: phandle-array
    required: true
    description: |
      The clock node this state configures, plus a specifier cell selecting the
      input (for a mux) or the gate setting (for a gate).

  clock-frequency:
    type: int
    required: true
    description: Frequency (Hz) produced at the consumer when this state is applied.

  rank:
    type: int
    default: 0
    description: |
      Rank used to arbitrate between candidate configurations. Lower is
      preferred (0 = best). On a shared node the best-ranked requested selection
      wins for every downstream consumer.
