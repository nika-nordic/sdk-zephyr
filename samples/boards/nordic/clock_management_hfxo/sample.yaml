sample:
  name: Clock-state concept demo (nRF54LM20B)
  description: >
    Models the nRF54LM20B clock tree as devicetree producers, binds peripherals
    (consumers) to them with clock-state nodes carrying a rank, and drives the
    producers at runtime through the reference-counted nrf_clock_control
    request/release API so multiple consumers can share a clock.
tests:
  sample.boards.nordic.clock_management_hfxo:
    platform_allow:
      - nrf54lm20dk/nrf54lm20a/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20a/cpuapp
    tags:
      - clock_control
      - clock_management
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Clock-state concept demo"
        - "Rank arbitration"
        - "Shared HFXO via request/release"
